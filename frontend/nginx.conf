server {
    listen 80;
    server_name _;

    # ── React SPA ──────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # All unknown paths fall back to index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse-proxy /api → FastAPI backend ──────────────────────────────────
    # The frontend calls /api/... ; nginx strips the prefix and forwards to backend:8000
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Health probe (used by AWS ELB / load balancers) ───────────────────────
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

